<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mad Kiwi Contact</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 90%;
  max-width: 420px;
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

p {
  color: #ccc;
  font-size: 16px;
  margin-bottom: 30px;
}

.button {
  display: block;
  width: 100%;
  padding: 20px;
  background: #7AC943;
  color: #111;
  text-decoration: none;
  font-size: 22px;
  font-weight: bold;
  border-radius: 16px;
  box-sizing: border-box;
}

.small {
  margin-top: 25px;
  font-size: 13px;
  color: #888;
}
  .credit {
    margin-top: 30px;
    font-size: 12px;
    color: #888;
}

.credit a {
    color: #7AC943;
    text-decoration: none;
}
</style>
</head>

<body>
  <div class="card">
    <h1>Mad Kiwi</h1>
    <p>Tap the button below to save the contact.</p>

    <a class="button" href="Madkiwi.vcf">
      Save Contact
    </a>

    <p class="credit">
      Digital Business Card Powered by Mad Kiwi<br>
      <a href="mailto:contact@madkiwi.net">
        contact@madkiwi.net
      </a>
    </p>

  </div>
